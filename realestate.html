<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script>document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault();},{passive:false});var _lte=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-_lte<=300)e.preventDefault();_lte=n;},false);</script>
    <title>Asset Tracker - Real Estate</title>

    <link rel="icon" href="/icons/android-chrome-192x192.png" sizes="192x192">
    <link rel="icon" href="/icons/android-chrome-512x512.png" sizes="512x512">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css?v=51">
    <link rel="stylesheet" href="css/components.css?v=3">
    <link rel="stylesheet" href="css/dashboard.css?v=43">
    <link rel="stylesheet" href="css/dashboard-mobile.css?v=3">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
    <script>
        // Anti-flash scripts
        if (localStorage.getItem('sidebarState') === 'true') {
            document.documentElement.classList.add('sidebar-collapsed');
        }
        // Show admin link immediately if user is admin (no flash)
        if (localStorage.getItem('isAdmin') === 'true') {
            document.addEventListener('DOMContentLoaded', () => {
                const adminLink = document.getElementById('admin-invitations-link');
                if (adminLink) adminLink.style.display = 'flex';
            });
        }
    </script>
    <style>
        /* ===== Page Immobilier ===== */
        .re-page {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            --re-green: #10b981;
            --re-red: #f87171;
            --re-amber: #f59e0b;
        }

        .re-section { margin-bottom: 40px; }

        .re-section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 20px;
        }

        .re-section-icon {
            display: inline-flex;
            padding: 8px;
            border-radius: 8px;
            font-size: 22px;
        }

        .re-section-icon--blue { background: rgba(59, 130, 246, 0.12); color: #3b82f6; }
        .re-section-icon--green { background: rgba(16, 185, 129, 0.12); color: #10b981; }

        .re-divider { border-top: 1px solid var(--border-color); margin: 0 0 32px; }

        .is-positive { color: var(--re-green) !important; }
        .is-negative { color: var(--re-red) !important; }
        .is-warning { color: var(--re-amber) !important; }
        .is-right { text-align: right; }

        /* --- KPI tiles --- */
        .re-kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .re-kpi {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px 20px;
            min-width: 0;
        }

        .re-kpi--accent {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.22) 0%, rgba(37, 99, 235, 0.08) 100%);
            border-color: rgba(59, 130, 246, 0.45);
        }

        .re-kpi-label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .re-kpi-value {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.15;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .re-kpi-value small {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-left: 2px;
        }

        .re-kpi-meta {
            margin-top: 8px;
            font-size: 12.5px;
            color: var(--text-secondary);
            line-height: 1.45;
        }

        .re-kpi-meta strong { color: var(--text-primary); font-weight: 600; }

        .re-ownership {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            font-size: 12.5px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .re-ownership-bar {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .re-ownership-bar span {
            display: block;
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
        }

        .re-alert {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.35);
            color: #fbbf24;
            font-size: 13px;
        }

        /* --- Résidence --- */
        .residence-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .residence-name { font-size: 18px; font-weight: 600; color: var(--text-primary); }
        .residence-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

        .residence-dashboard {
            display: grid;
            grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
            gap: 16px;
        }

        .residence-side { display: flex; flex-direction: column; gap: 16px; }

        .re-subtitle {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .re-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 18px;
        }

        .re-list > div {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 7px 0;
            font-size: 13px;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .re-list > div:last-child { border-bottom: 0; }
        .re-list strong { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

        .re-chart-small { position: relative; height: 230px; }
        .re-chart-note { margin-top: 8px; font-size: 11px; color: var(--text-muted); }

        /* --- Cartes crédit --- */
        .credits-container { display: flex; flex-direction: column; gap: 12px; }

        .credit-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--credit-color);
            border-radius: 12px;
            padding: 16px 18px;
        }

        .credit-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 14px;
        }

        .credit-title { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        .credit-name { font-size: 15px; font-weight: 600; color: var(--text-primary); }

        .credit-rate {
            font-size: 12px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            color: var(--credit-color);
            background: color-mix(in srgb, var(--credit-color) 15%, transparent);
        }

        .credit-monthly {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .credit-monthly small, .credit-metrics small {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .credit-metrics {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px 20px;
        }

        .credit-metrics > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .credit-metrics span { font-size: 12px; color: var(--text-muted); }
        .credit-metrics strong { font-size: 14px; font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }

        .credit-card .re-progress-bar {
            background: linear-gradient(90deg, var(--credit-color), color-mix(in srgb, var(--credit-color) 60%, white));
        }

        /* --- Badges & progress --- */
        .re-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .re-badge--muted { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; }
        .re-badge--success { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .re-badge--warning { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

        .re-progress {
            width: 100%;
            height: 6px;
            margin-top: 14px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .re-progress-bar {
            height: 100%;
            min-width: 2px;
            border-radius: 3px;
            background: linear-gradient(90deg, #10b981, #34d399);
            transition: width 0.3s ease;
        }

        .re-progress-meta {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 6px;
            font-size: 11.5px;
            color: var(--text-muted);
        }

        /* --- Crowdfunding --- */
        .re-chart-section { margin-bottom: 32px; }

        .re-projects-title {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin: 0 0 16px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .re-projects-title span { font-size: 13px; font-weight: 500; color: var(--text-muted); }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 18px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .project-card:hover { transform: translateY(-2px); border-color: rgba(16, 185, 129, 0.5); }
        .project-card.is-matured { border-color: rgba(245, 158, 11, 0.45); }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 14px;
        }

        .project-title-block { min-width: 0; }
        .project-title { font-weight: 600; font-size: 15px; color: var(--text-primary); }

        .project-subtitle {
            font-size: 11.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-top: 2px;
        }

        .project-tags { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

        .project-tag {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .project-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            font-size: 13px;
        }

        .project-dates {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12.5px;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        .stat-val { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

        .re-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .re-empty i { font-size: 44px; opacity: 0.5; display: block; margin-bottom: 12px; }
        .re-empty h3 { margin: 0 0 8px; color: var(--text-primary); }
        .re-empty p { margin-bottom: 20px; }

        .re-empty--boxed {
            background: var(--bg-secondary);
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 56px 20px;
        }

        /* --- Modale : lignes de crédit --- */
        .credit-row-item {
            display: grid;
            grid-template-columns: 2fr 1.5fr 0.8fr 0.8fr 1.2fr 1.2fr 40px;
            gap: 10px;
            align-items: end;
            background: var(--bg-secondary);
            padding: 12px;
            border-radius: 8px;
        }

        .credit-field { min-width: 0; }
        .credit-field label { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
        .credit-field input { width: 100%; }
        .credit-row-item .btn-icon-danger { height: 42px; }

        /* --- Responsive --- */
        @media (max-width: 1100px) {
            .re-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 900px) {
            .residence-dashboard { grid-template-columns: 1fr; }
            .credit-row-item { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .credit-field--name { grid-column: 1 / -1; }
            .credit-row-item .btn-icon-danger { grid-column: 1 / -1; width: 100%; }
        }

        @media (max-width: 560px) {
            .re-kpi-grid { grid-template-columns: 1fr; }
            .re-kpi-value { font-size: 24px; }
            .project-grid { grid-template-columns: 1fr; }
            .residence-header { align-items: flex-start; }
        }
    </style>
    <script>
        (function(){if(localStorage.getItem('isAdmin')==='true')return;try{var m=JSON.parse(localStorage.getItem('userModules'));if(!m)return;var map={'dashboard.html':'dashboard','investments.html':'assets','index.html':'transactions','analytics.html':'analytics','watchlist.html':'watchlist','screener.html':'screener','news.html':'news','realestate.html':'realestate','assistant.html':'assistant'};var css='';for(var h in map){if(m[map[h]]===false)css+='.nav-item[href="'+h+'"]{display:none!important}';}if(css){var s=document.createElement('style');s.textContent=css;document.head.appendChild(s);}}catch(e){}})();
    </script>
</head>

<body>
    <header class="mobile-header" id="mobile-header"></header>

    <aside class="app-sidebar" id="app-sidebar"></aside>
    <script src="./src/sidebar-render.js"></script>

    <main class="main-content">
        <div class="container">

            <div class="re-page">

                <!-- SECTION 1: RÉSIDENCE PRINCIPALE -->
                <section class="re-section">
                    <h2 class="re-section-title">
                        <span class="re-section-icon re-section-icon--blue"><i class="ph ph-house-line" aria-hidden="true"></i></span>
                        Ma Résidence Principale
                    </h2>
                    <div id="primary-residence-section">
                        <!-- Rendered by JS -->
                    </div>
                </section>

                <div class="re-divider"></div>

                <!-- SECTION 2: CROWDFUNDING -->
                <section class="re-section">
                    <h2 class="re-section-title">
                        <span class="re-section-icon re-section-icon--green"><i class="ph ph-crane" aria-hidden="true"></i></span>
                        Crowdfunding Immobilier
                    </h2>

                    <!-- HERO KPIs (rendus par JS) -->
                    <div id="crowdfunding-kpis" class="re-kpi-grid"></div>

                    <!-- PROJECTION CHART -->
                    <div id="projection-section" class="dashboard-chart-section re-chart-section">
                        <div class="chart-header-mini">
                            <div class="title-mini">
                                <h3 class="chart-title"><span class="title-icon"><i class="ph ph-chart-line-up" aria-hidden="true"></i></span>Projection de valeur jusqu'à l'échéance</h3>
                            </div>
                        </div>
                        <div class="chart-wrapper tall">
                            <canvas id="projection-chart"></canvas>
                        </div>
                    </div>

                    <!-- PROJECTS GRID -->
                    <h3 class="re-projects-title">Projets en cours <span id="projects-count"></span></h3>
                    <div id="projects-container" class="project-grid">
                        <!-- Project Cards generated by JS -->
                        <div class="re-empty">Chargement des projets...</div>
                    </div>
                </section>

            </div>

        </div>
    </main>

    <!-- MODAL RESIDENCE PRINCIPALE -->
    <div class="modal-overlay" id="primary-residence-modal" style="display: none;">
        <div class="modal-content" style="max-width: 950px; width: 95%;">
            <div class="modal-header">
                <h3><i class="ph ph-house" aria-hidden="true"></i> Ma Résidence Principale</h3>
                <button class="modal-close" onclick="window.realEstateApp.closePrimaryResidenceModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="primary-residence-form"
                    onsubmit="event.preventDefault(); window.realEstateApp.savePrimaryResidence();">

                    <!-- Property Details -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
                        <div class="form-group">
                            <label>Nom du bien</label>
                            <input type="text" id="residence-name" class="form-input" placeholder="Ex: Maison Lyon"
                                required>
                        </div>
                        <div class="form-group">
                            <label>Date d'achat</label>
                            <input type="date" id="residence-date" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label>Prix d'achat (€)</label>
                            <input type="number" id="residence-price" class="form-input" step="any" placeholder="0"
                                required>
                        </div>
                        <div class="form-group">
                            <label>Valeur Actuelle Estimée (€)</label>
                            <input type="number" id="residence-value" class="form-input" step="any" placeholder="0"
                                required>
                        </div>
                    </div>

                    <div style="border-top: 1px solid var(--border-color); margin: 24px 0;"></div>

                    <!-- Credits Section -->
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <h4 style="margin: 0;">Financement (Crédits)</h4>
                        <button type="button" class="btn-secondary btn-sm"
                            onclick="window.realEstateApp.addCreditRow()">
                            <i class="ph ph-plus"></i> Ajouter un crédit
                        </button>
                    </div>

                    <div id="credits-list-container"
                        style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px;">
                        <!-- Credits rows populated by JS -->
                    </div>

                    <div class="modal-footer"
                        style="margin-top: 32px; display: flex; justify-content: flex-end; gap: 12px;">
                        <button type="button" class="btn-secondary"
                            onclick="window.realEstateApp.closePrimaryResidenceModal()">Annuler</button>
                        <button type="submit" class="btn-primary">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
    <script type="module" src="./src/authGuard.js"></script>
    <script type="module" src="./src/realEstateApp.js"></script>
    <script type="module" src="./src/sidebar.js"></script>
</body>

</html>
